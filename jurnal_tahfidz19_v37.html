<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Informasi & Jurnal Tahfidz Digital Terintegrasi Berjenjang | PONPES MANARA AL QUR'AN</title>
<meta name="description" content="Sistem Informasi & Jurnal Tahfidz terintegrasi untuk PONPES MANARA AL QUR'AN. Dashboard manajemen untuk Yayasan, Guru, dan Orang Tua.">
<meta name="theme-color" content="#022c22">

<!-- Vendor & framework scripts (deferred to improve render performance) -->
<script defer src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script defer src="https://unpkg.com/lucide@1.28.0/dist/umd/lucide.js"></script>
<script defer src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<!-- Project helpers (moved from inline into assets/js/) -->
<script defer src="/assets/js/init-charts.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<style>
  :root{
    --emerald-950:#022c22;
    --emerald-900:#064e3b;
    --emerald-800:#065f46;
    --emerald-700:#047857;
    --emerald-600:#059669;
    --emerald-50:#ecfdf5;
    --gold-500:#c9952c;
    --gold-400:#d9ab4e;
    --ink:#1c2521;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Plus Jakarta Sans', sans-serif;
    background-color:var(--emerald-50);
    color:var(--ink);
    margin:0;
    min-height:100vh;
  }
  .font-display{ font-family:'Reem Kufi', sans-serif; }

  /* Geometric arabesque divider - signature element */
  .arabesque-rule{
    height:10px;
    width:100%;
    background-image:
      radial-gradient(circle at 5px 5px, var(--gold-500) 1.6px, transparent 1.8px),
      radial-gradient(circle at 15px 5px, var(--gold-500) 1.6px, transparent 1.8px);
    background-size:20px 10px;
    background-repeat:repeat-x;
    opacity:0.55;
  }
  .geo-bg{
    background-color:var(--emerald-900);
    background-image:
      linear-gradient(135deg, rgba(255,255,255,0.04) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.04) 75%),
      linear-gradient(45deg, rgba(255,255,255,0.04) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.04) 75%);
    background-size:46px 46px;
  }
  .card-step{
    position:relative;
    box-shadow:
      0 1px 2px rgba(2,44,34,0.06),
      0 8px 20px -8px rgba(2,44,34,0.18),
      0 2px 6px -2px rgba(2,44,34,0.10);
    transition:transform 0.18s ease, box-shadow 0.18s ease;
  }
  .card-step:hover{
    transform:translateY(-3px);
    box-shadow:
      0 2px 4px rgba(2,44,34,0.08),
      0 16px 32px -10px rgba(2,44,34,0.24),
      0 4px 10px -2px rgba(2,44,34,0.12);
  }
  .card-step::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;
    height:4px;
    background:var(--emerald-600);
    border-radius:4px 4px 0 0;
    box-shadow:0 1px 2px rgba(0,0,0,0.15);
  }

  /* ===================== EFEK DEPTH 3D — TOMBOL ===================== */
  button{
    box-shadow:
      0 1px 1px rgba(0,0,0,0.06),
      0 4px 10px -3px rgba(0,0,0,0.20);
    transition:transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
  }
  button:hover:not(:disabled){
    transform:translateY(-1.5px);
    filter:brightness(1.03);
    box-shadow:
      0 2px 3px rgba(0,0,0,0.08),
      0 8px 16px -4px rgba(0,0,0,0.26);
  }
  button:active:not(:disabled){
    transform:translateY(0.5px) scale(0.98);
    box-shadow:
      0 1px 1px rgba(0,0,0,0.10),
      0 2px 4px -2px rgba(0,0,0,0.18);
    filter:brightness(0.98);
  }

  /* ===================== EFEK DEPTH 3D — INPUT & SELECT ===================== */
  input, select, textarea{
    box-shadow:inset 0 1px 2px rgba(2,44,34,0.06);
    transition:box-shadow 0.15s ease, transform 0.1s ease;
  }

  /* ===================== EFEK DEPTH 3D — BADGE & LENCANA STATUS ===================== */
  .badge{
    box-shadow:
      0 1px 1px rgba(0,0,0,0.05),
      0 2px 5px -1px rgba(0,0,0,0.12);
  }

  /* ===================== EFEK DEPTH 3D — KOTAK GRID REKAP JUZ ===================== */
  #rekapJuzGrid > div{
    box-shadow:
      0 1px 1px rgba(0,0,0,0.06),
      0 3px 6px -2px rgba(0,0,0,0.16);
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  #rekapJuzGrid > div:hover{
    transform:translateY(-2px) scale(1.05);
    box-shadow:
      0 2px 3px rgba(0,0,0,0.08),
      0 6px 14px -3px rgba(0,0,0,0.22);
  }

  /* ===================== EFEK DEPTH 3D — BARIS TABEL ===================== */
  #tabelSantriBody tr, #tabelYayasanBody tr, #riwayatLogBody tr, #logPengajarBody tr, #printTableBody tr{
    transition:background-color 0.12s ease, box-shadow 0.12s ease;
  }
  #tabelSantriBody tr:hover, #tabelYayasanBody tr:hover, #riwayatLogBody tr:hover, #logPengajarBody tr:hover{
    background-color:rgba(5,150,105,0.05);
    box-shadow:inset 3px 0 0 var(--emerald-600);
  }

  /* ===================== EFEK DEPTH 3D — LOGIN CARD & ICON BADGE ===================== */
  #loginScreen .bg-white.rounded-2xl{
    box-shadow:
      0 4px 6px rgba(2,44,34,0.10),
      0 20px 44px -12px rgba(2,44,34,0.40),
      0 8px 18px -6px rgba(2,44,34,0.20);
  }
  #loginScreen .w-16.h-16{
    box-shadow:
      0 2px 3px rgba(0,0,0,0.20),
      0 10px 18px -6px rgba(2,44,34,0.45),
      inset 0 1px 1px rgba(255,255,255,0.15);
  }
  header.bg-emerald-900{
    box-shadow:0 2px 12px -2px rgba(2,44,34,0.35);
  }

  /* ===================== EFEK DEPTH 3D — PROGRESS BAR ===================== */
  .progress-track{
    box-shadow:inset 0 1px 2px rgba(0,0,0,0.10);
  }
  .progress-track > div{
    box-shadow:0 1px 2px rgba(0,0,0,0.15);
  }
  .scrollbar-thin::-webkit-scrollbar{ height:6px; width:6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb{ background:var(--emerald-700); border-radius:10px; }

  .progress-track{
    background-image:repeating-linear-gradient(90deg, rgba(6,95,70,0.12) 0 4px, transparent 4px 5%);
  }

  .badge{
    display:inline-flex;align-items:center;gap:4px;
    padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;
  }
  .badge-setor{ background:#d1fae5; color:#065f46; }
  .badge-utang{ background:#fee2e2; color:#991b1b; }
  .badge-izin{ background:#fef3c7; color:#92400e; }
  .badge-none{ background:#e5e7eb; color:#374151; }
  .badge-locked{ background:#fde68a; color:#78350f; }
  .badge-open{ background:#bbf7d0; color:#14532d; }

  input:focus, select:focus, textarea:focus{
    outline:none;
    box-shadow:0 0 0 3px rgba(5,150,105,0.25);
    border-color:var(--emerald-600);
  }

  /* ===================== LAYOUT SIDEBAR ===================== */
  .app-layout{
    display:flex;
    min-height:100vh;
  }
  .sidebar{
    width:240px;
    flex-shrink:0;
    background:var(--emerald-950);
    color:#fff;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .sidebar-brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:18px 16px;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .sidebar-nav{
    padding:12px 10px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .sidebar-link{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 12px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    color:rgba(255,255,255,0.65);
    cursor:pointer;
    transition:background-color 0.15s ease, color 0.15s ease;
    border:none;
    background:none;
    width:100%;
    text-align:left;
  }
  .sidebar-link:hover{
    background:rgba(255,255,255,0.06);
    color:#fff;
  }
  .sidebar-link.active{
    background:var(--emerald-700);
    color:#fff;
    box-shadow:0 2px 8px -2px rgba(0,0,0,0.4);
  }
  .sidebar-link .ic{
    font-size:15px;
    width:18px;
    text-align:center;
    flex-shrink:0;
  }
  .sidebar-motivasi{
    margin:16px 10px;
    padding:14px;
    background:rgba(255,255,255,0.06);
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.08);
  }
  .main-col{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    background:#fff;
    border-bottom:1px solid var(--border, #e5e7eb);
  }
  .guru-page{ display:none; }
  .guru-page.active{ display:block; }
  .ortu-page{ display:none; }
  .ortu-page.active{ display:block; }
  /* FASE 23: bagian-bagian di dalam setiap halaman dashboard (kartu KPI, grafik,
     ranking, dsb) sebelumnya tidak punya jarak vertikal yang didefinisikan sama
     sekali, sehingga jaraknya terlihat acak/tidak konsisten antar bagian.
     Aturan ini menyamakan jarak antar bagian langsung di ketiga halaman. */
  .guru-page.active > * + *,
  .yayasan-page.active > * + *,
  .ortu-page.active > * + *{ margin-top:20px; }
  .yayasan-page{ display:none; }
  .yayasan-page.active{ display:block; }
  @media (max-width: 900px){
    .sidebar{ position:fixed; left:0; z-index:60; transform:translateX(-100%); transition:transform 0.2s ease; }
    .sidebar.sidebar-open{ transform:translateX(0); }
    .sidebar-backdrop{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:55; }
    .sidebar-backdrop.show{ display:block; }
  }

  /* Visibility helpers for role screens */
  .hidden-screen{ display:none !important; }


  /* ===================== PRINT STYLES ===================== */
  #printArea{ display:none; }

  @media print{
    body{ background:#fff !important; }
    .no-print{ display:none !important; }
    #appShell{ display:none !important; }
    #loginScreen{ display:none !important; }
    #printArea{
      display:block !important;
      color:#000;
      font-family:'Plus Jakarta Sans', sans-serif;
    }
    #printArea .print-header{
      display:flex;
      align-items:center;
      gap:16px;
      border-bottom:4px double #000;
      padding-bottom:10px;
      margin-bottom:14px;
    }
    #printArea table{ width:100%; border-collapse:collapse; font-size:12px; }
    #printArea th, #printArea td{ border:1px solid #000; padding:5px 7px; text-align:left; }
    #printArea th{ background:#e5e5e5 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .sign-box{ border-top:1px solid #000; margin-top:48px; padding-top:6px; text-align:center; font-size:12px; }
    @page{ margin:18mm 14mm; }
    /* FASE 3: Sertifikat Tasmi' — printArea terpisah, ditukar via body.print-mode-sertifikat */
    #printSertifikatArea{ display:none !important; }
    #printRaporArea{ display:none !important; }
    body.print-mode-sertifikat #printArea{ display:none !important; }
    body.print-mode-sertifikat #printSertifikatArea{
      display:flex !important; flex-direction:column; align-items:center; justify-content:center;
      min-height:90vh; text-align:center; border:10px double #c9952c; padding:40px 30px; color:#022c22;
    }
    body.print-mode-rapor #printArea{ display:none !important; }
    body.print-mode-rapor #printRaporArea{ display:block !important; color:#000; font-family:'Plus Jakarta Sans', sans-serif; }
    #printRaporArea table{ width:100%; border-collapse:collapse; font-size:12px; margin-top:10px; }
    #printRaporArea th, #printRaporArea td{ border:1px solid #000; padding:5px 7px; text-align:left; }
    #printRaporArea th{ background:#e5e5e5 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    #printSertifikatArea .sert-eyebrow{ font-size:13px; letter-spacing:3px; text-transform:uppercase; color:#c9952c; font-weight:700; margin-bottom:6px; }
    #printSertifikatArea .sert-title{ font-size:30px; font-weight:800; margin-bottom:18px; }
    #printSertifikatArea .sert-nama{ font-size:26px; font-weight:800; text-decoration:underline; margin:14px 0; }
    #printSertifikatArea .sert-body{ font-size:14px; max-width:560px; line-height:1.7; margin:0 auto 20px; }
    #printSertifikatArea .sert-sign-row{ display:flex; justify-content:space-between; width:100%; max-width:560px; margin-top:50px; }
    #printSertifikatArea .sert-sign-box{ font-size:12px; text-align:center; }
    #printSertifikatArea .sert-sign-line{ border-top:1px solid #000; margin-top:52px; padding-top:6px; min-width:170px; }
  }
  #printSertifikatArea{ display:none; }
  #printRaporArea{ display:none; }
</style>

<!-- =========================================================
     EXECUTIVE DASHBOARD YAYASAN — CSS TAMBAHAN (BARU)
     Tidak mengubah style lama, hanya menambah & mempercantik
     tampilan khusus untuk Dashboard Yayasan.
     ========================================================= -->
<style id="execDashboardStyles">
  :root{
    --exec-green-950:#022c1e;
    --exec-green-900:#053a28;
    --exec-green-800:#0b5c3a;
    --exec-green-700:#0f7a4a;
    --exec-green-600:#159a5c;
    --exec-green-500:#1fb56d;
    --exec-green-100:#e3f8ec;
    --exec-green-50:#f2fbf6;
    --exec-amber:#e69b0f;
    --exec-amber-bg:#fef3d9;
    --exec-red:#dc2626;
    --exec-red-bg:#fee2e2;
    --exec-line:#e7efe9;
    --exec-text:#1c2521;
    --exec-muted:#6b7c73;
    --exec-radius:18px;
    --exec-radius-sm:14px;
  }

  /* Sembunyikan tampilan lama yang sudah digantikan versi baru yang lebih lengkap
     — fungsi/JS aslinya TETAP berjalan seperti semula, hanya tidak ditampilkan. */
  #yayasanStatCards{ display:none; }

  /* ============== EXEC GENERIC CARD ============== */
  .exec-card{
    background:#fff;
    border:1px solid var(--exec-line);
    border-radius:var(--exec-radius);
    box-shadow:0 1px 2px rgba(2,44,34,0.05), 0 10px 24px -12px rgba(2,44,34,0.14);
    transition:transform 0.3s ease, box-shadow 0.3s ease;
  }
  .exec-card:hover{ box-shadow:0 4px 10px -2px rgba(2,44,34,0.10), 0 18px 32px -14px rgba(2,44,34,0.20); }
  .exec-section-title{
    font-family:'Reem Kufi', sans-serif;
    color:var(--exec-green-900);
    font-size:16px;
    display:flex; align-items:center; gap:8px;
  }
  .exec-section-sub{ color:var(--exec-muted); font-size:12px; margin-top:2px; }

  /* ============== EXEC HEADER ============== */
  .exec-header-card{
    background:var(--exec-green-800);
    border-radius:var(--exec-radius);
    padding:18px 22px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap:wrap;
    box-shadow:0 12px 28px -12px rgba(2,44,34,0.45);
    position:relative;
  }
  /* FASE 10: overflow:hidden dipindah ke elemen dekoratif ::before saja —
     sebelumnya di parent, sehingga dropdown notifikasi/profil (position:absolute)
     ikut terpotong begitu melewati batas bawah kartu header. */
  .exec-header-card::before{
    content:"";
    position:absolute; inset:0;
    border-radius:inherit;
    background-image:radial-gradient(circle at 8px 8px, rgba(255,255,255,0.06) 1.6px, transparent 1.8px);
    background-size:22px 22px;
    opacity:0.6;
    pointer-events:none;
  }
  .exec-header-left{ display:flex; align-items:center; gap:12px; position:relative; z-index:1; }
  .exec-header-logo{
    width:46px; height:46px; border-radius:14px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.18);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; flex-shrink:0;
  }
  .exec-header-title{ font-family:'Reem Kufi', sans-serif; color:#fff; font-size:20px; line-height:1.2; margin:0; }
  .exec-header-sub{ color:rgba(255,255,255,0.65); font-size:12px; margin:2px 0 0; }
  .exec-header-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; position:relative; z-index:1; }

  .exec-date-pill{
    display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.16);
    color:#eafaf1;
    font-size:11.5px; font-weight:600;
    padding:8px 14px; border-radius:999px;
    white-space:nowrap;
  }
  .exec-date-sep{ opacity:0.5; }

  .exec-search-wrap{ position:relative; display:flex; align-items:center; }
  .exec-search-icon{ position:absolute; left:12px; font-size:13px; opacity:0.7; }
  .exec-search-input{
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.18);
    color:#fff;
    border-radius:999px;
    padding:8px 12px 8px 32px;
    font-size:12.5px;
    width:190px;
    box-shadow:none;
  }
  .exec-search-input::placeholder{ color:rgba(255,255,255,0.6); }
  .exec-search-input:focus{ outline:none; box-shadow:0 0 0 3px rgba(255,255,255,0.18); border-color:rgba(255,255,255,0.4); width:230px; transition:width 0.25s ease; }

  .exec-icon-btn{
    width:38px; height:38px; border-radius:12px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.18);
    color:#fff; font-size:15px;
    display:flex; align-items:center; justify-content:center;
    position:relative; cursor:pointer;
  }
  .exec-badge-dot{
    position:absolute; top:-3px; right:-3px;
    min-width:16px; height:16px; padding:0 3px;
    background:var(--exec-red); color:#fff;
    border-radius:999px; font-size:9.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    border:2px solid var(--exec-green-800);
  }
  .exec-notif-wrap, .exec-profile-wrap{ position:relative; }
  .exec-dropdown{
    position:absolute; top:calc(100% + 10px); right:0;
    background:#fff; color:var(--exec-text);
    border-radius:14px; border:1px solid var(--exec-line);
    box-shadow:0 20px 40px -16px rgba(2,44,34,0.35);
    width:290px; max-height:340px; overflow-y:auto;
    z-index:80; padding:8px;
  }
  .exec-dropdown-title{ font-size:11px; font-weight:800; color:var(--exec-green-800); text-transform:uppercase; letter-spacing:.04em; padding:8px 8px 4px; }
  .exec-dropdown-item{
    width:100%; text-align:left; display:flex; align-items:flex-start; gap:8px;
    padding:9px 8px; border-radius:10px; font-size:12.5px; font-weight:600; color:var(--exec-text);
    background:none; border:none; cursor:pointer;
    flex-wrap:wrap; white-space:normal; overflow-wrap:break-word; word-break:break-word;
  }
  /* FASE 9: perbaikan teks terpotong pada dropdown lonceng/menu profil — flex item kini boleh wrap */
  .exec-dropdown-item span{ flex:1 1 auto; min-width:0; white-space:normal; overflow-wrap:break-word; word-break:break-word; line-height:1.4; }
  .exec-dropdown-item:hover{ background:var(--exec-green-50); }
  .exec-dropdown-empty{ padding:16px 8px; text-align:center; color:var(--exec-muted); font-size:12px; }

  .exec-profile-btn{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:999px; padding:6px 12px 6px 6px;
    color:#fff; cursor:pointer;
  }
  .exec-profile-avatar{ width:26px; height:26px; border-radius:999px; background:rgba(255,255,255,0.18); display:flex; align-items:center; justify-content:center; font-size:13px; }
  .exec-profile-name{ font-size:12.5px; font-weight:700; }
  .exec-caret{ font-size:10px; opacity:0.7; }

  /* ============== QUICK ACTIONS ============== */
  .exec-quick-actions{
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:10px;
  }
  @media (max-width:1024px){ .exec-quick-actions{ grid-template-columns:repeat(3, 1fr); } }
  @media (max-width:560px){ .exec-quick-actions{ grid-template-columns:repeat(2, 1fr); } }
  .exec-qa-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    background:#fff; border:1px solid var(--exec-line);
    border-radius:var(--exec-radius-sm); padding:14px 8px;
    font-size:11.5px; font-weight:700; color:var(--exec-green-900);
    box-shadow:0 1px 2px rgba(2,44,34,0.05);
  }
  .exec-qa-btn span{ font-size:19px; }
  .exec-qa-btn:hover{ background:var(--exec-green-50); border-color:var(--exec-green-100); }

  /* ============== FILTER BAR ============== */
  .exec-filter-bar{
    display:flex; flex-wrap:wrap; gap:10px;
    background:#fff; border:1px solid var(--exec-line);
    border-radius:var(--exec-radius-sm);
    padding:12px 14px;
  }
  .exec-filter-item{ display:flex; flex-direction:column; gap:4px; min-width:130px; flex:1; }
  .exec-filter-item label{ font-size:10.5px; font-weight:800; color:var(--exec-muted); text-transform:uppercase; letter-spacing:.03em; }
  .exec-filter-item select{
    border:1px solid var(--exec-line); border-radius:10px; padding:7px 10px;
    font-size:12.5px; font-weight:600; color:var(--exec-text); background:var(--exec-green-50);
  }

  /* ============== ALERT CARDS ============== */
  .exec-alert-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; }
  @media (max-width:800px){ .exec-alert-grid{ grid-template-columns:1fr; } }
  .exec-alert-card{
    border-radius:var(--exec-radius-sm);
    padding:14px 16px;
    display:flex; align-items:flex-start; gap:10px;
    border:1px solid transparent;
  }
  .exec-alert-icon{ font-size:20px; flex-shrink:0; }
  .exec-alert-title{ font-size:12.5px; font-weight:800; }
  .exec-alert-desc{ font-size:11.5px; margin-top:2px; opacity:0.85; }
  .exec-alert-green{ background:var(--exec-green-50); border-color:var(--exec-green-100); color:var(--exec-green-800); }
  .exec-alert-amber{ background:var(--exec-amber-bg); border-color:#fde3a3; color:#8a5a05; }
  .exec-alert-red{ background:var(--exec-red-bg); border-color:#fecaca; color:#991b1b; }

  /* ============== KPI CARDS ============== */
  .exec-kpi-grid{ display:grid; grid-template-columns:repeat(6, 1fr); gap:12px; }
  @media (max-width:1200px){ .exec-kpi-grid{ grid-template-columns:repeat(3, 1fr); } }
  @media (max-width:640px){ .exec-kpi-grid{ grid-template-columns:repeat(2, 1fr); } }
  .exec-kpi-card{
    background:#fff; border:1px solid var(--exec-line); border-radius:var(--exec-radius);
    padding:14px 16px; position:relative; overflow:hidden;
    box-shadow:0 1px 2px rgba(2,44,34,0.05), 0 8px 18px -10px rgba(2,44,34,0.14);
    transition:transform 0.25s ease, box-shadow 0.25s ease;
  }
  .exec-kpi-card:hover{ transform:translateY(-3px); box-shadow:0 4px 8px -2px rgba(2,44,34,0.10), 0 16px 28px -12px rgba(2,44,34,0.20); }
  .exec-kpi-top{ display:flex; align-items:center; justify-content:space-between; }
  .exec-kpi-icon{
    width:34px; height:34px; border-radius:10px;
    background:var(--exec-green-100); color:var(--exec-green-800);
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .exec-kpi-trend{ font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:999px; }
  .exec-kpi-trend.up{ background:var(--exec-green-100); color:var(--exec-green-800); }
  .exec-kpi-trend.down{ background:var(--exec-red-bg); color:var(--exec-red); }
  .exec-kpi-trend.flat{ background:#f1f5f2; color:var(--exec-muted); }
  .exec-kpi-value{ font-family:'Reem Kufi', sans-serif; font-size:22px; color:var(--exec-green-900); margin-top:10px; }
  .exec-kpi-label{ font-size:11px; color:var(--exec-muted); margin-top:2px; font-weight:600; }
  .exec-kpi-spark{ margin-top:8px; height:26px; width:100%; display:block; }

  /* ============== TARGET CIRCULAR PROGRESS ============== */
  .exec-target-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; }
  @media (max-width:900px){ .exec-target-grid{ grid-template-columns:repeat(2, 1fr); } }
  .exec-target-card{
    background:#fff; border:1px solid var(--exec-line); border-radius:var(--exec-radius);
    padding:16px; text-align:center;
  }
  .exec-progress-ring{ transform:rotate(-90deg); }
  .exec-progress-bg{ fill:none; stroke:var(--exec-line); stroke-width:9; }
  .exec-progress-fg{ fill:none; stroke:var(--exec-green-600); stroke-width:9; stroke-linecap:round; transition:stroke-dashoffset 0.8s ease; }
  .exec-target-percent{ font-family:'Reem Kufi', sans-serif; font-size:17px; fill:var(--exec-green-900); }
  .exec-target-name{ font-size:12.5px; font-weight:800; color:var(--exec-green-900); margin-top:8px; }
  .exec-target-detail{ font-size:10.5px; color:var(--exec-muted); margin-top:2px; }

  /* ============== RANKING ============== */
  .exec-ranking-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; }
  @media (max-width:900px){ .exec-ranking-grid{ grid-template-columns:1fr; } }
  .exec-rank-row{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px; border-radius:12px;
    border:1px solid var(--exec-line);
    margin-bottom:8px;
  }
  .exec-rank-row:last-child{ margin-bottom:0; }
  .exec-rank-medal{ width:28px; height:28px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
  .exec-rank-medal.gold{ background:#fef3c7; }
  .exec-rank-medal.silver{ background:#e5e7eb; }
  .exec-rank-medal.bronze{ background:#fed7aa; }
  .exec-rank-name{ font-size:12.5px; font-weight:700; color:var(--exec-text); }
  .exec-rank-detail{ font-size:10.5px; color:var(--exec-muted); }
  .exec-rank-value{ margin-left:auto; font-family:'Reem Kufi', sans-serif; font-size:14px; color:var(--exec-green-800); text-align:right; }

  /* ============== MINI CALENDAR ============== */
  .exec-cal-grid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:3px; text-align:center; }
  .exec-cal-dow{ font-size:10px; font-weight:800; color:var(--exec-muted); padding:4px 0; }
  .exec-cal-day{ font-size:11.5px; padding:6px 0; border-radius:8px; color:var(--exec-text); position:relative; }
  .exec-cal-day.today{ background:var(--exec-green-800); color:#fff; font-weight:800; }
  .exec-cal-day.has-event::after{ content:""; position:absolute; bottom:2px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:999px; background:var(--exec-amber); }
  .exec-cal-day.empty{ visibility:hidden; }
  .exec-agenda-item{ display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px dashed var(--exec-line); font-size:11.5px; }
  .exec-agenda-item:last-child{ border-bottom:none; }
  .exec-agenda-dot{ width:8px; height:8px; border-radius:999px; flex-shrink:0; }

  /* ============== TIMELINE ============== */
